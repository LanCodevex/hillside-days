let stars;
function buildStars() {
  const n = CFG.starCount, pos = new Float32Array(n * 3), st = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const y = rr(-1, 1), a = rr(0, Math.PI * 2), r = Math.sqrt(1 - y * y);
    pos.set([Math.cos(a) * r * 560, y * 560, Math.sin(a) * r * 560], i * 3);
    st.set([rand() < 0.1 ? rr(3.6, 5.0) : rr(1.7, 3.1), rr(0.6, 2.2), rr(0, 6.28)], i * 3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aStar', new THREE.BufferAttribute(st, 3));
  stars = new THREE.Points(geo, starMat);
  stars.renderOrder = -9; stars.frustumCulled = false;
  skyGroup.add(stars);
}

// 积云:每朵云由三层柔边圆团叠成(底部暗面 / 主体 / 顶部亮面),既有体积又边缘柔和
const cloudMats = [0, 1, 2].map(() => new THREE.SpriteMaterial({ map: puffTex, fog: false, depthWrite: false, transparent: true }));
const cloudGroup = new THREE.Group();
scene.add(cloudGroup);
function buildClouds() {
  const N = 16;
  for (let i = 0; i < N; i++) {
    const az = i / N * Math.PI * 2 + rr(-0.16, 0.16), el = (i % 3 === 0 ? rr(3, 15) : rr(-34, -7)) * DEG, dist = rr(150, 215);
    const Wc = rr(40, 68) * dist / 180, H = Wc * 0.42;
    const g = new THREE.Group();
    g.position.set(Math.cos(el) * Math.sin(az) * dist, Math.sin(el) * dist + 3, Math.cos(el) * Math.cos(az) * dist);
    g.rotation.y = az + Math.PI;                       // 让云的宽度方向垂直于视线
    const puff = (layer, x, y, sx, sy) => {
      const s = new THREE.Sprite(cloudMats[layer]);
      s.position.set(x, y, 0); s.scale.set(sx, sy, 1); s.renderOrder = 1 + layer; g.add(s);
    };
    for (let k = 0; k < 5; k++) puff(2, (k / 4 - 0.5) * Wc * 0.78 + rr(-2, 2), -H * 0.1, Wc * rr(0.3, 0.4), Wc * rr(0.19, 0.25));
    for (let k = 0; k < 7; k++) {
      const u = k / 6, prof = Math.pow(Math.sin(u * Math.PI), 0.7), s = Wc * rr(0.27, 0.38) * (0.6 + 0.4 * prof);
      puff(1, (u - 0.5) * Wc * 0.8, H * (0.12 + 0.38 * prof * rr(0.7, 1.1)), s, s * 0.9);
    }
    for (let k = 0; k < 6; k++) {
      const u = rr(0.12, 0.88), prof = Math.sin(u * Math.PI), s = Wc * rr(0.18, 0.3) * (0.55 + 0.45 * prof);
      puff(0, (u - 0.5) * Wc * 0.7, H * (0.32 + 0.55 * prof * rr(0.75, 1.05)), s, s);
    }
    cloudGroup.add(g);
  }
}

// 积雨云:三座高耸的云塔。每座先在画布上“画”出来(一团团明暗交叠的云球,亮度 = 明暗信息),
// 着色器再把亮度映射成 底部暖灰紫 → 主体 → 顶部亮白 三种随时间预设变化的颜色。
// 它们跟着镜头的俯仰一起移动,所以无论俯视还是平视,云塔都立在画面上方约三分之一处。
const towerUniforms = { cTop: { value: new THREE.Color() }, cBody: { value: new THREE.Color() }, cBase: { value: new THREE.Color() } };
const towers = [], TOWER_DIST = 330;
function towerTexture() {
  const S = 512, [c, g] = makeCanvas(S, S), cx = S / 2, base = S * 0.9, H = S * 0.8;
  const disc = (x, y, r, v) => {
    const gr = g.createRadialGradient(x, y, 0, x, y, r), col = `${v},${v},${v}`;
    gr.addColorStop(0, `rgba(${col},1)`); gr.addColorStop(0.62, `rgba(${col},1)`); gr.addColorStop(0.86, `rgba(${col},0.5)`); gr.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  };
  const lean = rr(-0.07, 0.07), anvil = rr(0.7, 0.8), rows = 13;
  // 云塔的轮廓:底部宽、中段收窄、顶部再鼓出来(砧状),最顶上收圆
  const halfW = (u) => (lerp(0.44, 0.25, smoothstep(0, 0.4, u)) + 0.12 * Math.exp(-Math.pow((u - anvil) / 0.13, 2)))
    * (u > 0.86 ? Math.sqrt(Math.max(0, 1 - Math.pow((u - 0.86) / 0.16, 2))) : 1);
  for (let j = 0; j < rows; j++) {                     // 自下而上一排排云球:每个球先画暗面,再偏上画亮面
    const u = j / (rows - 1) * 0.97, half = halfW(u) * S, r = S * lerp(0.12, 0.07, u), n = Math.max(1, Math.round(half * 2 / (r * 0.95)));
    for (let i = 0; i <= n; i++) {
      const k = i / n, rad = r * rr(0.85, 1.25);
      const x = cx + lean * u * S + lerp(-half, half, k) * 0.92 + rr(-0.45, 0.45) * r, y = base - u * H + rr(-0.55, 0.55) * r;
      const shade = Math.round(lerp(60, 160, u)), light = Math.round(Math.min(255, lerp(96, 255, Math.pow(u, 0.6)) + (0.5 - k) * 34));   // 越高越亮,朝光一侧更亮
      disc(x, y + rad * 0.18, rad, shade);
      disc(x - rad * 0.1, y - rad * 0.12, rad * 0.88, light);
    }
  }
  for (let i = 0; i < 9; i++) {                        // 顶部再点几个最亮的小云球
    const u = rr(0.55, 0.95), half = halfW(u) * S * 0.7;
    disc(cx + lean * u * S + rr(-half, half), base - u * H, S * rr(0.035, 0.06), 255);
  }
  g.globalCompositeOperation = 'destination-out';      // 云底削平,并向下淡出
  const fade = g.createLinearGradient(0, base - S * 0.01, 0, base + S * 0.07);
  fade.addColorStop(0, 'rgba(0,0,0,0)'); fade.addColorStop(1, 'rgba(0,0,0,1)');
  g.fillStyle = fade; g.fillRect(0, base - S * 0.01, S, S);
  return new THREE.CanvasTexture(c);
}
function buildThunderheads() {
  // az:所在方位(度,默认全景镜头正对约 148°) · w/h:云塔的宽和高
  for (const [i, spec] of [{ az: 127, w: 122, h: 82 }, { az: 151, w: 152, h: 98 }, { az: 173, w: 112, h: 74 }].entries()) {
    const mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false,
      uniforms: { map: { value: towerTexture() }, ...towerUniforms },
      vertexShader: /* glsl */`
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: /* glsl */`
        varying vec2 vUv;
        uniform sampler2D map; uniform vec3 cTop, cBody, cBase;
        void main() {
          vec4 t = texture2D(map, vUv);
          vec3 col = mix(mix(cBase, cBody, smoothstep(0.22, 0.62, t.r)), cTop, smoothstep(0.6, 0.97, t.r));
          gl_FragColor = vec4(col, t.a);
          #include <colorspace_fragment>
        }`,
    });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1).translate(0, 0.5, 0), mat);   // 原点在云底

  vertexShader: /* glsl */`
    attribute vec3 aSeed;   // 相位、速度、大小
    uniform float uTime, uPx, uOpacity;
    varying float vA;
    void main() {

const TIMES = {

    fog: '#cfeaf8', cl0: '#ffffff', cl1: '#f3f5fc', cl2: '#bcc7ea', clBase: '#b5a5c0', disc: '#fffbe8', discSize: 0.045, glow: 1.0,

    fog: '#ffc79a', cl0: '#fff1d6', cl1: '#ffc8a2', cl2: '#b9809e', clBase: '#a8718f', disc: '#fff0c4', discSize: 0.055, glow: 1.3,

  },

    sunAz: -25, sunEl: 48, sunCol: '#a3b6ff', sunInt: 1.0, hemiSky: '#4252ac', hemiGnd: '#2e2c5c', hemiInt: 1.3,
    fog: '#1d2a5c', cl0: '#55659c', cl1: '#38467c', cl2: '#202b5a', clBase: '#1d2550', disc: '#f3f0dc', discSize: 0.034, glow: 0.45,

const ENV_COLORS = ['top', 'mid', 'hor', 'bot', 'sunCol', 'hemiSky', 'hemiGnd', 'fog', 'cl0', 'cl1', 'cl2', 'clBase', 'disc', 'glass', 'glassOff', 'smoke'];

const TIME_FADE = 1.5;                                 // 时间切换的过渡时长(秒)
function makeEnv(p) { const e = { sunAz: p.sunAz }; for (const k of ENV_COLORS) e[k] = new THREE.Color(p[k]); for (const k of ENV_NUMS) e[k] = p[k]; return e; }
function copyEnv(dst, src) { dst.sunAz = src.sunAz; for (const k of ENV_COLORS) dst[k].copy(src[k]); for (const k of ENV_NUMS) dst[k] = src[k]; }

let envT = 1;

function setTime(name) {

  copyEnv(envTo, makeEnv(TIMES[name]));
  envTo.sunAz = envFrom.sunAz + ((envTo.sunAz - envFrom.sunAz + 540) % 360 - 180);     // 方位角走最短的弧
  envT = 0;

}
function updateEnv(dt) {

  cloudMats[0].color.copy(env.cl0); cloudMats[1].color.copy(env.cl1); cloudMats[2].color.copy(env.cl2);

/* ═══════════════════════════════════════════════════════════════════════
   8. 镜头预设:在球坐标里做缓动插值,绕着场景划一道弧线过去
   ═══════════════════════════════════════════════════════════════════════ */
const camTween = { active: false, t: 0, dur: 1.8, fromT: new THREE.Vector3(), toT: new THREE.Vector3(), fromS: new THREE.Spherical(), toS: new THREE.Spherical(), done: null };
const _sph = new THREE.Spherical(), _vec = new THREE.Vector3();
let fitDist = 40, camMode = 'overview';

function flyTo(pos, target, dur = 1.8, done = null) {
  camTween.fromT.copy(controls.target); camTween.toT.copy(target);
  camTween.fromS.setFromVector3(_vec.copy(camera.position).sub(controls.target));
  camTween.toS.setFromVector3(_vec.copy(pos).sub(target));
  const d = camTween.toS.theta - camTween.fromS.theta;
  camTween.toS.theta = camTween.fromS.theta + (((d + Math.PI) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;   // 方位角走近路
  camTween.t = 0; camTween.dur = dur; camTween.done = done; camTween.active = true;
}
function updateCamTween(dt) {
  if (!camTween.active) return;
  camTween.t = Math.min(1, camTween.t + dt / camTween.dur);
  const k = easeInOut(camTween.t), a = camTween.fromS, b = camTween.toS;
  controls.target.lerpVectors(camTween.fromT, camTween.toT, k);
  _sph.set(lerp(a.radius, b.radius, k), lerp(a.phi, b.phi, k), lerp(a.theta, b.theta, k));
  camera.position.setFromSpherical(_sph).add(controls.target);
  if (camTween.t >= 1) { camTween.active = false; if (camTween.done) camTween.done(); }
}
function orbitPos(azDeg, elDeg, dist) {
  const az = azDeg * DEG, el = elDeg * DEG;
  return v3(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az)).multiplyScalar(dist).add(VIEW_TARGET);
}
const CAMERAS = {
  // 全景:三分之四视角,略微俯视
  overview: () => flyTo(orbitPos(-32, 23, fitDist), VIEW_TARGET),
  // 门廊:贴近摇椅的低机位
  porch: () => flyTo(refs.porchCam, refs.porchTarget, 2.2),
  // 缓慢环绕:先退到环绕轨道上,再开启自动旋转
  orbit: () => {
    const azNow = Math.atan2(camera.position.x - VIEW_TARGET.x, camera.position.z - VIEW_TARGET.z) / DEG;
    flyTo(orbitPos(azNow, 17, fitDist * 0.95), VIEW_TARGET, 1.6, () => { controls.autoRotate = true; });
  },
};
function setCamera(name) {
  camMode = name;
  controls.autoRotate = false;
  CAMERAS[name]();
  document.querySelectorAll('[data-cam]').forEach((b) => b.classList.toggle('on', b.dataset.cam === name));
}
// 用户一旦自己拖拽/缩放,就打断镜头过渡(环绕模式下松手后会继续自动旋转;单纯的点击不算)
function userTookControl() {
  camTween.active = false;
  if (camMode === 'orbit' || camMode === 'free') return;
  camMode = 'free';
  document.querySelectorAll('[data-cam]').forEach((b) => b.classList.remove('on'));
}
canvas.addEventListener('wheel', userTookControl, { passive: true });

/* ═══════════════════════════════════════════════════════════════════════
   9. 交互:悬停高亮(窗户、信箱、秋千),点击弹出手账卡片
   ═══════════════════════════════════════════════════════════════════════ */
const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
let pointerDirty = false, pointerInside = false, dragging = false, hovered = null, downX = 0, downY = 0, downT = 0, swingPush = 0;
const HL_COLOR = new THREE.Color(0.3, 0.23, 0.1), WHITE = new THREE.Color(1, 1, 1);

function setPointer(e) {
  const r = canvas.getBoundingClientRect();
  pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
}
function pickObject() {
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickList, false);     // 最近的若是墙体等遮挡物,则什么都没选中
  return hits.length ? (hits[0].object.userData.it || null) : null;
}
let pickList = [];
canvas.addEventListener('pointermove', (e) => {
  setPointer(e); pointerDirty = true; pointerInside = e.pointerType === 'mouse';
  if (dragging && Math.hypot(e.clientX - downX, e.clientY - downY) > 6) userTookControl();
});
canvas.addEventListener('pointerleave', () => { pointerInside = false; pointerDirty = true; });
canvas.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; downT = performance.now(); dragging = true; canvas.classList.add('dragging'); });
window.addEventListener('pointerup', (e) => {
  if (!dragging) return;
  dragging = false; canvas.classList.remove('dragging');
  // 没怎么移动的短按才算点击(否则是拖拽旋转)
  if (Math.hypot(e.clientX - downX, e.clientY - downY) < 6 && performance.now() - downT < 500) {
    setPointer(e);
    const it = pickObject();
    if (it) activate(it);
  }
});
function activate(it) {
  if (it.type === 'window') openCard(it.room);
  else if (it.type === 'mailbox') openCard('letter');
  else if (it.type === 'swing') swingPush = 1;                  // 点一下秋千,推它一把
}
function updateInteraction(dt) {
  if (pointerDirty && !dragging) {
    pointerDirty = false;
    hovered = pointerInside && !cardOpen ? pickObject() : null;
    canvas.classList.toggle('hot', !!hovered);
  }
  const k = 1 - Math.exp(-dt * 12);
  for (const it of interactives) {
    it.hl += ((it === hovered ? 1 : 0) - it.hl) * k;
    if (it.type === 'window') {
      it.frameMat.emissive.copy(HL_COLOR).multiplyScalar(it.hl);
      it.glassMat.color.copy(it.lit ? env.glass : env.glassOff).multiplyScalar(it.lit ? 1 + env.lamp * 0.6 : 1).lerp(WHITE, it.hl * 0.5);   // 夜里亮灯的窗超过 1,带出辉光
    } else {
      it.mat.emissive.copy(HL_COLOR).multiplyScalar(it.hl * 0.9);
    }
  }
}

buildMailbox();
buildClothesline();
buildYard();
buildWindmill();
buildStars();
buildClouds();
buildThunderheads();
buildSmoke();
buildFireflies();
pickList = [...pickTargets, ...occluders];
porchLight.position.copy(refs.house.localToWorld(refs.lampLocal.clone()));
sideLight.position.copy(refs.house.localToWorld(v3(-HOUSE_DIM.W / 2 - 0.9, HOUSE_DIM.F0 + 1.3, -0.5)));
lawnLight.position.copy(refs.house.localToWorld(v3(1.3, 1.5, 5.7)));
rightLight.position.copy(refs.house.localToWorld(v3(HOUSE_DIM.W / 2 + 0.9, HOUSE_DIM.F0 + 1.3, 0.2)));

/* ── 后期处理与画质 ──
   高画质:EffectComposer = 渲染 → Bloom(辉光) → 暖色调色 + 暗角 → 输出
   低画质:跳过整条后期链直接渲染,并降低像素比、阴影分辨率、草的数量,关掉两盏补光 */
const GradeShader = {
  uniforms: { tDiffuse: { value: null }, uWarm: { value: 1 }, uVignette: { value: 1 } },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform float uWarm, uVignette; varying vec2 vUv;
    void main() {
      vec4 c = texture2D(tDiffuse, vUv);
      vec3 col = c.rgb * mix(vec3(1.0), vec3(1.05, 1.0, 0.93), uWarm);        // 轻微偏暖
      col = mix(vec3(dot(col, vec3(0.2126, 0.7152, 0.0722))), col, 1.06);     // 饱和度略提一点
      float v = smoothstep(0.42, 1.05, length((vUv - 0.5) * vec2(1.0, 0.88)) * 1.45);
      col *= mix(vec3(1.0), vec3(0.74, 0.68, 0.73), v * uVignette);           // 暗角:四周压暗并略偏暖紫
      gl_FragColor = vec4(col, c.a);
    }`,
};
let composer = null, bloomPass = null;
function buildComposer() {
  // 多重采样的半浮点渲染目标:保留抗锯齿,也保留超过 1 的亮度给 Bloom 用
  const target = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: IS_MOBILE ? 0 : 4 });
  composer = new EffectComposer(renderer, target);
  composer.addPass(new RenderPass(scene, camera));
  bloomPass = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.3, 0.7, 0.9);   // 强度与阈值每帧由时间预设决定(env.bloom / env.bloomThr)
  composer.addPass(bloomPass);
  composer.addPass(new ShaderPass(GradeShader));
  composer.addPass(new OutputPass());
}
let lowQuality = IS_MOBILE;                              // 手机默认低画质
try { const saved = localStorage.getItem('hillside-quality'); if (saved) lowQuality = saved === 'low'; } catch (e) { /* 本地存储不可用时忽略 */ }
const qualityBtn = document.getElementById('quality');
function applyQuality() {
  const size = lowQuality ? 1024 : CFG.shadowSize;
  if (sun.shadow.mapSize.x !== size) {
    sun.shadow.mapSize.set(size, size);
    if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  }
  refs.grass.count = lowQuality ? Math.round(refs.grassFull * 0.55) : refs.grassFull;
  lawnLight.visible = rightLight.visible = !lowQuality;
  if (!lowQuality && !composer) buildComposer();
  qualityBtn.innerHTML = `Quality · <b>${lowQuality ? 'Low' : 'High'}</b>`;
  qualityBtn.setAttribute('aria-pressed', String(lowQuality));
  resize();
}
qualityBtn.addEventListener('click', () => {
  lowQuality = !lowQuality;
  try { localStorage.setItem('hillside-quality', lowQuality ? 'low' : 'high'); } catch (e) { /* 忽略 */ }
  applyQuality();
});

// 窗口尺寸变化:更新画布与相机,并把画面中心让到信息栏以外的区域
function resize() {
  const w = Math.max(1, innerWidth), h = Math.max(1, innerHeight), mobile = w <= 720, pr = panel.getBoundingClientRect();
  const offX = mobile ? 0 : pr.width, offY = mobile ? pr.height : 0;
  const ratio = Math.min(devicePixelRatio, lowQuality ? 1 : CFG.maxPixelRatio);
  renderer.setPixelRatio(ratio);
  renderer.setSize(w, h, false);
  if (composer) { composer.setPixelRatio(ratio); composer.setSize(w, h); }
  camera.aspect = w / h;
  camera.setViewOffset(w, h, -offX / 2, offY / 2, w, h);
  camera.updateProjectionMatrix();
  // 让整个底座刚好放进可视区域所需的距离
  const t = Math.tan(CFG.fov * DEG / 2);
  const usableW = Math.max(1, w - offX), usableH = Math.max(1, h - offY);
  fitDist = clamp(Math.max(12.4 * h / (t * usableH), 16.8 * h / (t * usableW)), 34, 130);
  controls.maxDistance = fitDist * 1.5;
  // 还停在全景预设上时,窗口变化后重新取景,让底座始终完整可见
  if (camMode === 'overview' && !camTween.active) { camera.position.copy(orbitPos(-32, 23, fitDist)); controls.target.copy(VIEW_TARGET); }
  scene.fog.near = fitDist * 0.75; scene.fog.far = fitDist * 5.5;
  fireMat.uniforms.uPx.value = renderer.domElement.height / (2 * t);
  starMat.uniforms.uPR.value = renderer.getPixelRatio();
}
window.addEventListener('resize', resize);
applyQuality();                                              // 默认镜头 = Overview(在 resize 里取景)
controls.update();

const clock = new THREE.Clock(), _fwd = new THREE.Vector3();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  windUniforms.uTime.value = t;

  updateEnv(dt);
  updateCamTween(dt);
  controls.update();

  // 天穹跟随相机;俯视越多,渐变的“地平线”越往下移
  skyGroup.position.copy(camera.position);
  skyMat.uniforms.uTilt.value = camera.getWorldDirection(_fwd).y * 0.8;
  cloudGroup.rotation.y = t * 0.0045;                    // 云缓慢飘移
  updateThunderheads(t, _fwd.y);                         // 积雨云
  for (const vn of vines) {                              // 垂藤像钟摆一样轻摆
    vn.g.rotation.z = Math.sin(t * 0.9 + vn.phase) * vn.amp + vn.amp * 0.5;
    vn.g.rotation.x = Math.sin(t * 0.7 + vn.phase * 1.7) * vn.amp;
  }

  // 各种会动的小东西
  refs.rotor.rotation.z = -t * 0.38;                                                   // 风车
  swingPush *= Math.exp(-dt * 0.35);
  refs.swing.rotation.x = Math.sin(t * 1.15) * (0.09 + swingPush * 0.3);               // 秋千
  const rock = Math.sin(t * 1.25) * 0.075;                                             // 摇椅:绕弧形摇脚滚动
  refs.rocker.rotation.x = rock; refs.rocker.position.z = 0.95 * rock;
  updateCloths(t);
  updateSmoke(t);
  updateInteraction(dt);

  if (!lowQuality && composer) {
    bloomPass.strength = env.bloom; bloomPass.threshold = env.bloomThr;
    composer.render();
  } else {
    renderer.render(scene, camera);
  }
  requestAnimationFrame(tick);
}
updateEnv(0);
tick();
window.__hillsideReady = true;
document.body.classList.add('ready');
window.__hillside = { scene, camera, controls, renderer, setTime, setCamera, interactives };   // 方便在控制台里调试
</script>
